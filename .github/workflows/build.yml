name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          .spago
          output
          node_modules
        key: build-artifacts-v4-${{ hashFiles('package-lock.json', 'spago.yaml', 'spago.lock') }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24.13.0
    - run: npm i
    - run: npm run build
    - run: npm run test
